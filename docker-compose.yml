services:
  meetutu-backend:
    build: .
    image: meetutu-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      # Bound to localhost: put nginx/caddy in front for TLS.
      - "127.0.0.1:8787:8787"
    volumes:
      - meetutu-data:/data

volumes:
  meetutu-data:
